name: Arab Aura Full-Stack CI & Quality Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ========================================================
  # 1. Backend Unit & Feature Test Suite (Vitest)
  # ========================================================
  backend-tests:
    name: Backend Test Suite (RBAC, AI & Orders)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arab-aura-backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: arab-aura-backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Run Backend Vitest Suite
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret_token_arab_aura_2026
          PORT: 8000

  # ========================================================
  # 2. Frontend Unit & Component Test Suite (Vitest + RTL)
  # ========================================================
  frontend-tests:
    name: Frontend Test Suite (RTL, Dark Mode & Cart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arab-aura-frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: arab-aura-frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Vitest Suite
        run: npm test

      - name: Verify Production Build
        run: npm run build

  # ========================================================
  # 3. Playwright E2E Multi-Device & Localization Matrix
  # ========================================================
  e2e-matrix:
    name: Playwright Multi-Platform Matrix
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Root Dependencies
        run: npm install

      - name: Install Frontend Dependencies
        run: cd arab-aura-frontend && npm ci

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright Multi-Device Matrix
        run: npx playwright test --project=Mobile-iPhone14-RTL-Dark --project=Desktop-Chrome-RTL-Dark
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:5173
          CI: true

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
